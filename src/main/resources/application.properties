spring.application.name=sayyan

# ===============================
# DATABASE
# ===============================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/capstone3}
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=false
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=update

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

spring.output.ansi.enabled=always

# ===============================
# OPENROUTER
# ===============================

spring.ai.model.chat=openai
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.model=${OPENROUTER_MODEL:google/gemini-3.8-flash}
spring.ai.openai.chat.max-tokens=4000
# Larger output budget for maintenance JSON only; ordinary chat/image calls retain their existing limit.
sayyan.ai.maintenance.max-tokens=${OPENROUTER_MAINTENANCE_MAX_TOKENS:8192}
spring.ai.openai.max-retries=1
spring.ai.openai.timeout=30s

# ===============================
# EMAIL
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# WHATSLOOP
# ===============================

whatsloop.base-url=https://api.whatsloop.net/v1
whatsloop.token=${WHATSLOOP_TOKEN}
whatsloop.channel-id=1

# ===============================
# VEHICLE DATABASES API
# ===============================

vehicle-databases.base-url=https://api.vehicledatabases.com
vehicle-databases.api-key=${VEHICLE_DATABASES_API_KEY}

# ===============================
# FILE UPLOAD
# ===============================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
