spring.application.name=capstone3

spring.datasource.url=jdbc:mysql://localhost:8889/capstone3
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

# ===============================
# OPENROUTER
# ===============================

spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1

spring.ai.openai.chat.model=google/gemini-3.8-flash

spring.ai.openai.timeout=120s
spring.ai.openai.max-retries=1

# ===============================
# EMAIL
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000



whatsloop.base-url=https://api.whatsloop.net/v1
whatsloop.token=${WHATSLOOP_TOKEN}
whatsloop.channel-id=1