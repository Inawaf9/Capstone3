spring.application.name=capstone3

spring.datasource.url=jdbc:mysql://localhost:3306/capstone3
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop

spring.web.error.include-message=always
spring.web.error.include-stacktrace=always


whatsloop.base-url=https://api.whatsloop.net/v1
whatsloop.token=${WHATSLOOP_TOKEN}
whatsloop.channel-id=1